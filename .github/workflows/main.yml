name: Transformation Quest Build & Deploy

# Builds the web client (web/, a static React app) and publishes it to Vault's test-build CDN as the
# University of Calgary studio:
#   https://builds.vaultlearninggames.org/ucalgary/transformation-quest/<branch or tag>/
#   (https://builds.vaultlearninggames-staging.org/... while VAULT_PUBLISHER_URL points at the staging portal)
# Deleting a branch removes its preview.
#
# Only web/ is published. The Vault CDN hosts static files, so the data collection server (server/) is not part of
# this: the build leaves REACT_APP_DATA_COLLECTION_BASE_URL unset, which turns the client's /api calls off (as the
# Field Day build always did). Play data still goes to OpenGameData.
#
# Vault knows this repository belongs to the University of Calgary because the portal assigns it to that studio
# (Vault → Studios → University of Calgary → Repositories that publish for this studio, or studios.json in
# VaultLearningGames/vault-publisher). Without that, a VaultLearningGames repository publishes as the "vault" studio,
# which the `check-studio` job below reports as a failure.
#
# Which portal: the VAULT_PUBLISHER_URL variable. The organization's value is the production portal; this
# repository overrides it with a repository variable while it publishes to staging.
#
# Releases: push a version tag (e.g. v1.0), test it, then Request release in the portal.
on:
  push:
  delete:
  workflow_dispatch:

# publish-preview.yml authenticates to the portal with this workflow's OIDC token; a called workflow can't be given
# more than its caller has, so id-token is granted here.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build the web client
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      artifact: web-${{ github.sha }}
    defaults:
      run:
        working-directory: web
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: web/package-lock.json

    - run: npm ci

    # Relative asset paths and hash routes (…/#/level/3): one build plays from any folder, which Vault needs
    # because a release is the tested build copied, unchanged, to another address.
    - run: npm run build-vault

    - name: Check the build
      run: test -f build/index.html || { echo "::error::web/build has no index.html"; exit 1; }

    - uses: actions/upload-artifact@v7
      with:
        name: web-${{ github.sha }}
        path: web/build
        retention-days: 14
        if-no-files-found: error

  preview:
    needs: build
    uses: VaultLearningGames/vault-publisher/.github/workflows/publish-preview.yml@v1
    with:
      game: transformation-quest
      artifact: ${{ needs.build.outputs.artifact }}

  # The portal decides the studio from the repository. Fail loudly if the build landed anywhere else.
  check-studio:
    needs: preview
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Published as University of Calgary
      env:
        URL: ${{ needs.preview.outputs.url }}
      run: |
        case "$URL" in
          */ucalgary/transformation-quest/*) echo "Published to $URL" ;;
          *) echo "::error::Published to $URL, not to ucalgary/transformation-quest: this repository isn't assigned to the University of Calgary studio in the Vault portal."; exit 1 ;;
        esac

  remove-preview:
    if: github.event_name == 'delete'
    uses: VaultLearningGames/vault-publisher/.github/workflows/publish-preview.yml@v1
    with:
      game: transformation-quest
